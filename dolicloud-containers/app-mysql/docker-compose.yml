# Prueba local (sin Azure): Dolibarr + MySQL 8 en tu computador.
#   docker compose up -d   ->  http://localhost:8080  (admin / admin123)
#   docker compose down -v ->  borra todo
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: dolibarrdb
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarrpass123
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  dolibarr:
    image: dolibarr/dolibarr:22.0.5
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DOLI_DB_TYPE: mysqli
      DOLI_DB_HOST: mysql
      DOLI_DB_HOST_PORT: "3306"
      DOLI_DB_NAME: dolibarrdb
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolibarrpass123
      DOLI_URL_ROOT: http://localhost:8080
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin123
      DOLI_INSTALL_AUTO: "1"
      PHP_INI_DATE_TIMEZONE: America/Bogota
    volumes:
      - documents:/var/www/documents

volumes:
  mysql-data:
  documents:
